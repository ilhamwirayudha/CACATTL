<div class="kpi-interactive-section">
    <!-- Checkbox Hack: Murni CSS client-side tanpa memicu rerun Streamlit -->
    <input type="checkbox" id="kpi-petikemas-toggle" class="kpi-toggle-input" />

    <!-- Baris 1: Total Petikemas, Total Ritase, dan Rincian LOAD & DISC -->
    <div class="kpi-grid-row kpi-grid-top">
        <!-- 1. Total Petikemas (Clickable Label Trigger) -->
        <label for="kpi-petikemas-toggle" class="kpi-card variant-purple kpi-card-clickable kpi-card-label-trigger"
            title="Klik untuk menampilkan atau menyembunyikan rincian LOAD & DISC">
            <div class="kpi-header">
                <span class="kpi-label">TOTAL PETIKEMAS</span>
                <div class="kpi-header-actions">
                    <div class="kpi-toggle-pill">
                        <span class="pill-text-collapsed">Lihat Rincian ▾</span>
                        <span class="pill-text-expanded">Tutup ▴</span>
                    </div>
                </div>
            </div>
            <div class="kpi-value">{{ container_total }}</div>
            <div class="kpi-subtext">Semua Kontainer</div>
        </label>

        <!-- Wrapper Rincian (Container LOAD & DISC) dengan Animasi Buka & Tutup -->
        <div class="kpi-breakdown-wrapper">
            <div class="kpi-breakdown-inner">
                <!-- 2. Container LOAD (Muncul saat Total Petikemas diklik) -->
                <div class="kpi-card variant-amber kpi-breakdown-card">
                    <div class="kpi-header">
                        <span class="kpi-label">CONTAINER LOAD</span>
                    </div>
                    <div class="kpi-value">{{ container_load }}</div>
                    <div class="kpi-subtext">Total Muat</div>
                </div>

                <!-- 3. Container DISC (Muncul saat Total Petikemas diklik) -->
                <div class="kpi-card variant-teal kpi-breakdown-card">
                    <div class="kpi-header">
                        <span class="kpi-label">CONTAINER DISC</span>
                    </div>
                    <div class="kpi-value">{{ container_disc }}</div>
                    <div class="kpi-subtext">Total Bongkar</div>
                </div>
            </div>
        </div>

        <!-- 4. Total Ritase -->
        <div class="kpi-card variant-purple kpi-ritase-card">
            <div class="kpi-header">
                <span class="kpi-label">TOTAL RITASE</span>
            </div>
            <div class="kpi-value">{{ total_event }}</div>
            <div class="kpi-subtext">Ritase Truk</div>
        </div>
    </div>

    <!-- Baris 2: Hasil Deteksi Dual Cycle -->
    <div class="kpi-grid-row kpi-grid-bottom">
        <!-- 5. Dual Cycle -->
        <div class="kpi-card variant-blue">
            <div class="kpi-header">
                <span class="kpi-label">DUAL CYCLE</span>
            </div>
            <div class="kpi-value">{{ total_dual }}</div>
        </div>

        <!-- 6. Non Dual -->
        <div class="kpi-card variant-slate">
            <div class="kpi-header">
                <span class="kpi-label">NON DUAL</span>
            </div>
            <div class="kpi-value">{{ total_single }}</div>
        </div>

        <!-- 7. % Dual Cycle -->
        <div class="kpi-card variant-blue">
            <div class="kpi-header">
                <span class="kpi-label">% DUAL CYCLE</span>
            </div>
            <div class="kpi-value">{{ pct_dual_formatted }}</div>
        </div>
    </div>
</div>
